<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS GTA: Extreme City</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: #0f0; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; border: 1px solid #0f0; pointer-events: none; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; }
        .btn { width: 75px; height: 75px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; }
        .btn:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }
        .pedal { width: 90px; height: 60px; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="ui">
        <div>SPEED: <span id="speedo">0</span> KM/H</div>
        <div style="font-size: 10px; color: #aaa; margin-top: 5px;">TRAFFIC ACTIVE | STREET LIGHTS ON</div>
    </div>

    <div id="controls">
        <div style="display:flex; gap:20px;">
            <div class="btn" id="leftBtn">←</div>
            <div class="btn" id="rightBtn">→</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="btn pedal" id="upBtn" style="background:rgba(0,255,0,0.2)">GAS</div>
            <div class="btn pedal" id="downBtn" style="background:rgba(255,0,0,0.2)">BRK</div>
        </div>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const speedo = document.getElementById('speedo');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const worldSize = 5000;
        const roadWidth = 250;
        const buildings = [];
        const streetLights = [];
        const traffic = [];
        const input = { up: false, down: false, left: false, right: false };

        // --- Player Car ---
        const car = {
            x: 500, y: 500, w: 24, h: 48, angle: 0, speed: 0, 
            maxSpeed: 12, accel: 0.15, friction: 0.97, turnSpeed: 0.05
        };

        // --- City Generation ---
        function initCity() {
            // Create Grid Roads & Buildings
            for(let i=0; i<worldSize; i+=600) {
                for(let j=0; j<worldSize; j+=600) {
                    // Street Lights at intersections
                    streetLights.push({ x: i+50, y: j+50 }, { x: i+550, y: j+550 });
                    
                    // Shops/Hotels
                    const types = [
                        {n:"HOTEL", c:"#9b59b6"}, {n:"SHOP", c:"#e67e22"}, 
                        {n:"RESTO", c:"#e74c3c"}, {n:"STORE", c:"#3498db"}
                    ];
                    for(let k=0; k<3; k++) {
                        const type = types[Math.floor(Math.random()*types.length)];
                        buildings.push({
                            x: i + 100 + (k*150), y: j + 100,
                            w: 120, h: 120, color: type.c, name: type.n
                        });
                    }
                }
            }

            // Create NPC Traffic Cars
            for(let i=0; i<30; i++) {
                traffic.push({
                    x: Math.random() * worldSize,
                    y: Math.random() * worldSize,
                    w: 24, h: 48,
                    speed: 2 + Math.random() * 3,
                    color: `hsl(${Math.random()*360}, 50%, 50%)`,
                    axis: Math.random() > 0.5 ? 'H' : 'V' // Horizontal or Vertical movement
                });
            }
        }

        // --- Input Controls ---
        const bind = (id, k) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); input[k] = true; };
            el.ontouchend = (e) => { e.preventDefault(); input[k] = false; };
        };
        bind('upBtn', 'up'); bind('downBtn', 'down');
        bind('leftBtn', 'left'); bind('rightBtn', 'right');

        function update() {
            // Player Movement
            if (input.up) car.speed += car.accel;
            if (input.down) car.speed -= car.accel;
            car.speed *= car.friction;
            if (Math.abs(car.speed) > 0.1) {
                const dir = car.speed > 0 ? 1 : -1;
                if (input.left) car.angle -= car.turnSpeed * dir;
                if (input.right) car.angle += car.turnSpeed * dir;
            }
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;

            // NPC Traffic Movement
            traffic.forEach(t => {
                if(t.axis === 'H') t.x += t.speed; else t.y += t.speed;
                if(t.x > worldSize) t.x = 0; if(t.y > worldSize) t.y = 0;
            });

            speedo.innerText = Math.round(Math.abs(car.speed) * 20);
        }

        function draw() {
            ctx.fillStyle = "#111"; // Asphalt
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width/2 - car.x, canvas.height/2 - car.y);

            // 1. Draw Roads & Sidewalks
            ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
            for(let i=0; i<worldSize; i+=600) {
                ctx.fillStyle = "#222";
                ctx.fillRect(i, 0, roadWidth, worldSize); // Vertical Roads
                ctx.fillRect(0, i, worldSize, roadWidth); // Horizontal Roads
                // Yellow Lines
                ctx.setLineDash([20, 20]); ctx.strokeStyle = "#f1c40f";
                ctx.beginPath(); ctx.moveTo(i + roadWidth/2, 0); ctx.lineTo(i + roadWidth/2, worldSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i + roadWidth/2); ctx.lineTo(worldSize, i + roadWidth/2); ctx.stroke();
                ctx.setLineDash([]);
            }

            // 2. Draw Buildings
            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = "rgba(255,255,255,0.1)"; // Windows
                for(let wx=5; wx<b.w; wx+=30) ctx.fillRect(b.x+wx, b.y+20, 20, 20);
                ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial";
                ctx.fillText(b.name, b.x + 10, b.y + 15);
            });

            // 3. Draw Street Lights (Glow Effect)
            streetLights.forEach(s => {
                const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 100);
                grad.addColorStop(0, "rgba(255, 255, 150, 0.3)");
                grad.addColorStop(1, "transparent");
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(s.x, s.y, 100, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "#555"; ctx.fillRect(s.x-2, s.y-2, 4, 4); // Light post head
            });

            // 4. Draw Traffic Cars
            traffic.forEach(t => {
                ctx.save();
                ctx.translate(t.x, t.y);
                if(t.axis === 'V') ctx.rotate(Math.PI); else ctx.rotate(Math.PI/2);
                ctx.fillStyle = t.color;
                ctx.fillRect(-t.w/2, -t.h/2, t.w, t.h);
                ctx.fillStyle = "yellow"; ctx.fillRect(-t.w/2, -t.h/2, 5, 5); // Headlights
                ctx.restore();
            });

            // 5. Draw Player Car
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            ctx.shadowBlur = 15; ctx.shadowColor = "cyan";
            ctx.fillStyle = "cyan";
            ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
            ctx.fillStyle = "#111"; ctx.fillRect(-car.w/2+4, -car.h/2+8, car.w-8, 12); // Windshield
            ctx.restore();

            ctx.restore();
            requestAnimationFrame(draw);
        }

        initCity();
        setInterval(update, 1000/60);
        draw();

        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    </script>
</body>
</html>
